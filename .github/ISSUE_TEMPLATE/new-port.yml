name: Submit a port
description: Send a GitHub link to a native port (static recompilation or native execution). The daily discover job reads it and answers here.
title: "[port] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Paste the repository link and that's it. Within a day, the discover job reads its README, drafts the catalog entry and replies here; a maintainer reviews it before it goes live.

        Only source-code repositories are listed. Never link game files, ROMs, disc images, firmware or keys.
  - type: input
    id: repo
    attributes:
      label: GitHub repository
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the maintainer (optional)
      description: Anything the README doesn't say, such as which game and console it covers or what a fork adds.
