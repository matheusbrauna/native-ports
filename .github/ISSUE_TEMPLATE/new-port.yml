name: Submit a port
description: Suggest a native port (static recompilation or native execution) for the catalog.
title: "[port] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Only source-code repositories are listed. Never link game files, ROMs, disc images, firmware or keys.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/name on GitHub
      placeholder: owner/repository
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game(s) and original console
      placeholder: Forza Horizon (Xbox 360)
    validations:
      required: true
  - type: dropdown
    id: technique
    attributes:
      label: Technique
      options:
        - Static recompilation
        - Native execution (bbport-style runtime)
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain, if any
      placeholder: ReXGlue, XenonRecomp, N64Recomp, bbport…
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: Linux
        - label: Steam Deck
        - label: macOS
        - label: Android
        - label: iOS
        - label: ARM
  - type: dropdown
    id: status
    attributes:
      label: Status its README declares
      options:
        - Playable
        - In-game
        - Intro / menus only
        - In progress
        - Not stated
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What it does (and, for a fork, what it changes)
    validations:
      required: true
