name: CI

# Pull requests only: on main, the deploy workflow's build already runs the same validation.
# Discover opens its pull request with DISCOVER_PAT, so this pull_request run starts on its own.
# workflow_dispatch stays for a manual run.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job ("validate") to pass before merging.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Validate catalog data
        run: npm run validate
      # Builds from the committed repository stats; no API calls, no secrets, no deploy.
      - name: Build
        run: npm run build:offline
