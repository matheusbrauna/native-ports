name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily refresh of GitHub stats
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  SITE_URL: https://ports.matheusbrauna.com.br

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_PATH: /
      # Deploys dist/ to the Cloudflare Worker described in wrangler.jsonc,
      # including the ports.matheusbrauna.com.br custom domain.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
